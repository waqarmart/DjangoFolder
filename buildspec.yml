version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.13.3
    commands:
      - pip install --upgrade pip
      - pip install -r requirements.txt

  build:
    commands:
      - python manage.py collectstatic --noinput
      - mkdir -p package
      - find . -mindepth 1 -maxdepth 1 ! -name 'package' -exec cp -r {} package/ \;

artifacts:
  files:
    - '**/*'
  base-directory: package
